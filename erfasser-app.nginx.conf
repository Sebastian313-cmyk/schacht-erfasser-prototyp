# ============================================================
# NGINX KONFIGURATION - Erfasser App Private Hosting
# ============================================================
# 
# Installieren: sudo cp erfasser-app.nginx.conf /etc/nginx/sites-available/erfasser-app
#               sudo ln -s /etc/nginx/sites-available/erfasser-app /etc/nginx/sites-enabled/
#               sudo nginx -t && sudo systemctl reload nginx
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;  # ← Ihre Domain eintragen
    
    # Automatische HTTPS-Weiterleitung (nach Let's Encrypt Setup)
    # return 301 https://$server_name$request_uri;
    
    root /var/www/erfasser-app;
    index index.html;
    
    # ========== LOGS ==========
    access_log /var/log/nginx/erfasser-app-access.log;
    error_log /var/log/nginx/erfasser-app-error.log;
    
    # ========== CORS HEADERS (für API-Zugriff) ==========
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
    add_header Access-Control-Allow-Headers 'Origin, Content-Type, Accept' always;
    
    # ========== version.json (Update-Check) ==========
    location = /version.json {
        alias /var/www/erfasser-app/version.json;
        add_header Content-Type application/json;
        add_header Cache-Control 'no-cache, no-store, must-revalidate';
        add_header Pragma 'no-cache';
        add_header Expires '0';
    }
    
    # ========== Downloads (APK, Installer etc.) ==========
    location /downloads/ {
        alias /var/www/erfasser-app/downloads/;
        autoindex on;  # Ordner-Listing aktivieren
        
        # Optional: Passwortschutz aktivieren
        # auth_basic "Restricted Downloads";
        # auth_basic_user_file /etc/nginx/.htpasswd;
        
        # Download-Header setzen
        add_header Content-Disposition 'attachment';
        
        # Große Datei-Uploads erlauben (falls nötig)
        client_max_body_size 100M;
    }
    
    # ========== Web-App ==========
    location /downloads/web/ {
        alias /var/www/erfasser-app/downloads/web/;
        try_files $uri $uri/ /downloads/web/index.html;
        
        # Service Worker caching
        location ~* \.js$ {
            add_header Cache-Control 'public, max-age=31536000';
        }
        
        # index.html nie cachen (für Updates)
        location = /downloads/web/index.html {
            add_header Cache-Control 'no-cache, no-store, must-revalidate';
        }
    }
    
    # ========== Direkte Web-App Route (optional) ==========
    location / {
        alias /var/www/erfasser-app/downloads/web/;
        try_files $uri $uri/ /index.html;
    }
    
    # ========== GZIP Kompression ==========
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        application/atom+xml
        image/svg+xml;
}

# ========== HTTPS Konfiguration (nach Let's Encrypt Setup) ==========
# 
# SSL-Zertifikat mit Let's Encrypt erstellen:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d your-domain.com
# 
# Dann wird automatisch diese Server-Block generiert:

# server {
#     listen 443 ssl http2;
#     listen [::]:443 ssl http2;
#     server_name your-domain.com;
#     
#     ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
#     include /etc/letsencrypt/options-ssl-nginx.conf;
#     ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
#     
#     # ... Rest der Konfiguration wie oben
# }

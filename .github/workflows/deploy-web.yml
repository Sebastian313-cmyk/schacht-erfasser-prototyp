name: Build and deploy Flutter Web

on:
  push:
    branches:
      - import/erfasser-app
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4

      - name: Flutter installieren
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter-Version anzeigen
        run: flutter --version

      - name: Abhängigkeiten laden
        run: flutter pub get

      - name: Web-App für direkte Bereitstellung bauen
        run: flutter build web --release --base-href /

      - name: Direkte Routen auf die App zurückführen
        run: cp build/web/index.html build/web/404.html

      - name: Fertigen Web-Build sichern
        uses: actions/upload-artifact@v4
        with:
          name: erfasser-web
          path: build/web
          if-no-files-found: error

      - name: Build zusätzlich für GitHub Pages anpassen
        run: |
          sed -i 's|<base href="/">|<base href="/schacht-erfasser-prototyp/">|' build/web/index.html
          sed -i "s|register('/sw.js')|register('/schacht-erfasser-prototyp/sw.js')|" build/web/index.html
          cp build/web/index.html build/web/404.html

      - name: GitHub-Pages-Build hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: GitHub Pages konfigurieren
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
